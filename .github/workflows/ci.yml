name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Checkstyle 14.3.0 requires Java 21+ (bytecode version 65.0).
        java: ['21', '25']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Cache Node & NPM for frontend-maven-plugin
        uses: actions/cache@v6
        with:
          path: |
            node
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('pom.xml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build, lint, test, verify ITs, and generate site
        run: mvn -B -ntp clean install site
