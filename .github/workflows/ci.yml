name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Checkstyle 14.3.0 requires Java 21+ (bytecode version 65.0).
        java: ['21', '25']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: sonatype-central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Cache Node & NPM for frontend-maven-plugin
        uses: actions/cache@v6
        with:
          path: |
            node
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('pom.xml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build, lint, test, verify ITs, and generate site
        run: mvn -B -ntp clean install site

      # Rendered-page WCAG checks need a real browser, so they run here instead of inside
      # `mvn verify` (consumer sites never need Chromium). They scan the target/site/ built above.
      - name: Set up Node.js for accessibility checks
        if: matrix.java == '21'
        uses: actions/setup-node@v7
        with:
          # Keep in sync with <node.version> in pom.xml (frontend-maven-plugin).
          node-version: '22.14.0'
          cache: npm

      - name: Install npm dependencies
        if: matrix.java == '21'
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.java == '21'
        run: npx playwright install --with-deps chromium

      - name: Check rendered site accessibility (axe-core)
        if: matrix.java == '21'
        run: npm run test:a11y

      - name: Publish SNAPSHOT to Maven Central
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            mvn -B -ntp deploy -Prelease -Dinvoker.skip=true
          else
            echo "Skipping snapshot deploy for non-SNAPSHOT version $PROJECT_VERSION"
          fi

      - name: Configure GitHub Pages
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages site artifact
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
