name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Checkstyle 14.3.0 requires Java 21+ (bytecode version 65.0).
        java: ['21', '25']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Cache Node & NPM for frontend-maven-plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('pom.xml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build, lint, test, verify ITs, and generate site
        run: mvn -B -ntp clean install site

      # The same check as publish-snapshot's, which skips a release version, so this leg uploads
      # the build output only when that job will publish it.
      - name: Check for a SNAPSHOT version
        id: version
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping the build output upload for non-SNAPSHOT version $PROJECT_VERSION"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      # target/classes is the skin JAR's content that the Invoker tests just verified, for the
      # publish-snapshot job to sign.
      - name: Upload verified build output
        if: steps.version.outputs.snapshot == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-classes
          path: target/classes
          if-no-files-found: error
          retention-days: 1

      # The rendered sites for the accessibility job to scan, on pull requests too: the self-site
      # and the site each Invoker fixture rendered. The artifact's root is target/, the paths'
      # common ancestor, so it holds site/ and it/<fixture>/target/site/.
      - name: Upload rendered sites
        if: matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-site
          path: |
            target/site
            target/it/*/target/site
          if-no-files-found: error
          # Long enough to re-run only a failed accessibility job after a delay.
          retention-days: 7

      - name: Configure GitHub Pages
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages site artifact
        if: matrix.java == '21' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  # Rendered-page WCAG checks need a real browser, so they run here instead of inside
  # `mvn verify` (consumer sites never need Chromium). They scan the sites the JDK 21 leg rendered,
  # the self-site and every Invoker fixture's, in a job of their own so a slow browser install
  # cannot time out the build. A job can need
  # only the whole matrix, so a failed JDK 25 leg also skips this one.
  accessibility:
    name: Accessibility (axe-core)
    needs: verify
    runs-on: ubuntu-latest
    # Measured worst cases: npm ci 41 s and axe 425 s (run 43569166780), the browser install
    # 584 s (run 42216815589), and about 15 s for checkout, Node setup, and the download, or
    # 41 + 425 + 584 + 15 = 1065 s. 25 minutes (1500 s) leaves 435 s, enough for the axe step
    # to double alongside the slowest install seen.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in sync with <node.version> in pom.xml (frontend-maven-plugin).
          node-version: '22.14.0'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download rendered sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-site
          path: target

      # --require-fixtures fails the job when a fixture project's site is missing from the
      # artifact, rather than scanning only the self-site.
      - name: Check rendered site accessibility (axe-core)
        run: npm run test:a11y -- --require-fixtures

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [verify, accessibility]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Signs and publishes the verified SNAPSHOT in a fresh job, so no npm lifecycle script, Vite,
  # Vitest, Checkstyle, or Invoker run shares a runner with the signing key. Only Maven's jar,
  # source, gpg, and central-publishing goals run after the key import; naming goals instead of a
  # lifecycle phase keeps the build's other executions out of this job.
  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    needs: [verify, accessibility]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Maven cache: a cache saved by a job that ran npm lifecycle scripts must not supply the
      # plugins that run with the signing key.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check for a SNAPSHOT version
        id: version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping snapshot deploy for non-SNAPSHOT version $PROJECT_VERSION"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified build output
        if: steps.version.outputs.snapshot == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-classes
          path: target/classes

      - name: Set up GPG and publishing credentials
        if: steps.version.outputs.snapshot == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: sonatype-central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish SNAPSHOT to Maven Central
        if: steps.version.outputs.snapshot == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: >-
          mvn -B -ntp -Prelease
          jar:jar source:jar-no-fork@attach-sources jar:jar@attach-javadocs
          gpg:sign@sign-artifacts central-publishing:publish
