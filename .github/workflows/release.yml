name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and verifies with no publishing secrets: npm lifecycle scripts, Vite, Vitest, and the
  # Invoker tests run here, so this job never sees the signing key or a write token.
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Node & NPM for frontend-maven-plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('pom.xml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build, lint, test, and verify ITs
        run: mvn -B -ntp clean verify

      # target/classes is the skin JAR's content that the Invoker tests just verified.
      - name: Upload verified build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-classes
          path: target/classes
          if-no-files-found: error
          # Long enough to re-run only a failed publish job after a delay.
          retention-days: 7

  # Signs and publishes the verified output. Only Maven's jar, source, gpg, and
  # central-publishing goals run after the key import; naming goals instead of a lifecycle phase
  # keeps frontend-maven-plugin, Checkstyle, and the Invoker tests out of this job.
  publish:
    name: Publish to Maven Central & GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-classes
          path: target/classes

      # No Maven cache: a cache saved by a job that ran npm lifecycle scripts must not supply the
      # plugins that run with the signing key.
      - name: Set up JDK 21 and GPG
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: sonatype-central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish package to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: >-
          mvn -B -ntp -Prelease
          jar:jar source:jar-no-fork@attach-sources jar:jar@attach-javadocs
          gpg:sign@sign-artifacts central-publishing:publish

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]:/ { exit }
            found { print }
          ' CHANGELOG.md > target/release-notes.md

          if [ ! -s target/release-notes.md ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.changelog.outputs.has_notes }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              target/*.jar target/*.asc \
              --title "${GITHUB_REF_NAME}" \
              --notes-file target/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              target/*.jar target/*.asc \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
